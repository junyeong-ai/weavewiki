[package]
name = "claudegen"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Claude Code specialized guide and agent skill document generator"
license = "MIT"
repository = "https://github.com/junyeong-ai/claudegen"
keywords = ["cli", "claude-code", "ai", "documentation", "agents"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["claude-agent"]
claude-agent = ["dep:claude-agent"]

[dependencies]
# Claude Agent SDK - Direct API access with CLI OAuth support
claude-agent = { path = "../claude-agent-rs", optional = true, features = ["cli-integration", "jsonl"] }

# Ordered map for consistent YAML output
indexmap = { version = "2.12", features = ["serde"] }
tokio = { version = "1.49", features = ["full", "process"] }
async-trait = "0.1"

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
console = "0.16"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_bw = "2.5"
schemars = { version = "1.2", features = ["chrono04"] }

rusqlite = { version = "0.38", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.32"
dashmap = "6.1"

tree-sitter = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
glob = "0.3"
regex = "1"
rand = "0.9"

sha2 = "0.10"

thiserror = "2.0"
anyhow = "1.0"

secrecy = "0.10"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

directories = "6"
toml = { version = "0.9.11", features = ["preserve_order"] }
figment = { version = "0.10.19", features = ["toml", "env"] }

[dev-dependencies]
tempfile = "3"
proptest = "1.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
